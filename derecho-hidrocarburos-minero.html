<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Creador de Presentaciones Fácil</title>
    <style>
        /* --- ESTILOS MODERNOS Y LIMPIOS --- */
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F8FAFC;
            --editor-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --danger: #EF4444;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        /* --- MODO VISTA (Por Defecto) --- */
        body.view-mode #toolbar {
            display: none;
        }

        body.view-mode .editable:empty {
            display: none;
        }

        /* Barra de Herramientas Principal */
        #toolbar {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            align-items: center;
            justify-content: center;
        }

        .toolbar-group {
            display: flex;
            gap: 6px;
            border-right: 2px solid var(--border-color);
            padding-right: 12px;
            margin-right: 4px;
        }

        .toolbar-group:last-child {
            border-right: none;
            margin-left: auto;
            padding-right: 0;
        }

        button.tool-btn,
        label.tool-btn {
            background-color: white;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            width: 44px;
            height: 44px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            padding: 0;
            margin: 0;
        }

        button.tool-btn:hover,
        label.tool-btn:hover {
            background-color: var(--bg-color);
            border-color: #CBD5E1;
            transform: translateY(-2px);
        }

        button.tool-btn:active,
        label.tool-btn:active {
            transform: translateY(0);
        }

        button.tool-btn.primary {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        button.tool-btn.primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .tool-btn svg {
            width: 22px;
            height: 22px;
        }

        /* Área de Edición */
        #editor {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 5%;
            background: transparent;
            min-height: 60vh;
        }

        /* Contenedor de Bloques */
        .block-container {
            position: relative;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        /* Bloque Activo */
        body.edit-mode .block-container.active-block {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
            background-color: #FFFFFF;
        }

        /* Drag & Drop */
        .drag-handle {
            position: absolute;
            left: -30px;
            top: 50%;
            transform: translateY(-50%);
            cursor: grab;
            color: #94A3B8;
            display: none;
            padding: 5px;
            user-select: none;
            z-index: 10;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        body.edit-mode .block-container:hover .drag-handle {
            display: block;
        }

        .block-container.dragging {
            opacity: 0.4;
            background: #F1F5F9;
        }

        body.edit-mode .block-container:hover {
            border-color: var(--border-color);
            background-color: #FFFFFF;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        body.edit-mode .block-container.active-block:hover {
            border-color: var(--primary);
        }

        /* Acciones de bloque */
        .block-actions {
            position: absolute;
            top: -16px;
            right: -8px;
            display: none;
            gap: 6px;
            z-index: 10;
        }

        body.edit-mode .block-container:hover .block-actions,
        body.edit-mode .block-container.active-block .block-actions {
            display: flex;
        }

        .action-btn {
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            padding: 0;
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
        }

        .action-btn:hover {
            transform: scale(1.15);
        }

        .btn-delete {
            background: var(--danger);
        }

        .btn-edit {
            background: var(--primary);
        }

        .btn-move {
            background: #475569;
        }

        /* Tipografía Editable */
        .editable {
            outline: none;
            margin: 0;
            line-height: 1.3;
            min-height: 1em;
            overflow-wrap: break-word;
            word-break: break-word;
            transition: background 0.3s ease;
        }

        h1.editable {
            font-size: 4em;
            margin-bottom: 0.3em;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #0F172A;
        }

        h2.editable {
            font-size: 3.2em;
            margin-bottom: 0.3em;
            font-weight: 700;
            color: #1E293B;
        }

        h3.editable {
            font-size: 2.6em;
            margin-bottom: 0.3em;
            font-weight: 600;
            color: #334155;
        }

        h4.editable {
            font-size: 2.2em;
            margin-bottom: 0.3em;
            font-weight: 600;
            color: #475569;
        }

        p.editable {
            font-size: 1.8em;
            color: #475569;
            line-height: 1.6;
        }

        body.edit-mode .editable:empty::before {
            content: attr(data-placeholder);
            color: #CBD5E1;
            pointer-events: none;
            display: block;
        }

        body.edit-mode .editable:focus {
            background: rgba(241, 245, 249, 0.5);
            border-radius: 8px;
            padding: 5px;
            margin: -5px;
        }

        /* Imágenes y Videos */
        .img-element {
            width: 100%;
            max-width: 100%;
            border-radius: 16px;
            display: block;
            margin: 0 auto;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .video-wrapper {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .yt-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .yt-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .tk-wrapper {
            max-width: 400px;
            height: 700px;
            margin: 0 auto;
        }

        .tk-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .url-input-box {
            background: #F1F5F9;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px dashed #CBD5E1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .url-input-box p {
            width: 100%;
            margin: 0;
            color: #475569;
            font-size: 16px;
            font-weight: bold;
        }

        .url-input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .url-input-box input {
            flex: 1 1 200px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            min-width: 0;
            box-sizing: border-box;
            width: 100%;
        }

        .url-input-box input:focus {
            border-color: var(--primary);
        }

        .btn-apply {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        /* Layout Mixto */
        .wrap-container {
            display: block;
        }

        .wrap-container::after {
            content: "";
            clear: both;
            display: table;
        }

        .wrap-container .img-element,
        .wrap-container .url-input-box {
            float: right;
            width: 45%;
            max-width: 400px;
            margin: 0 0 20px 30px;
            clear: right;
        }

        .wrap-container p {
            min-height: 100px;
        }

        /* Bloque de Código */
        .code-wrapper {
            position: relative;
            background: #1E293B;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .code-wrapper pre {
            margin: 0;
            padding: 50px 20px 20px 20px;
            color: #F8FAFC;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            overflow-x: auto;
            white-space: pre;
            word-break: normal;
            overflow-wrap: normal;
            outline: none;
        }

        body.edit-mode .code-wrapper pre:empty::before {
            content: "Pega tu código aquí...";
            color: #64748B;
        }

        .btn-copy-code {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #334155;
            color: white;
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-copy-code:hover {
            background: #475569;
        }

        /* Botón Enlace Personalizado */
        .link-edit-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #F1F5F9;
            padding: 20px;
            border-radius: 12px;
            border: 2px dashed #CBD5E1;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .link-edit-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .link-edit-input {
            flex: 1 1 200px;
            padding: 12px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            min-width: 0;
            box-sizing: border-box;
            width: 100%;
        }

        .link-edit-input:focus {
            border-color: var(--primary);
        }

        /* --- ESTILOS DE TAREAS / QUIZ (Edición) --- */
        .quiz-edit-container {
            background: #F8FAFC;
            padding: 20px;
            border-radius: 16px;
            border: 2px dashed #CBD5E1;
            width: 100%;
            box-sizing: border-box;
        }

        .quiz-title-input {
            width: 100%;
            padding: 15px;
            font-size: 1.5em;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
            color: #0F172A;
            outline: none;
            box-sizing: border-box;
        }

        .quiz-title-input:focus {
            border-color: var(--primary);
        }

        .quiz-edit-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 15px;
            border: 1px solid #E2E8F0;
            width: 100%;
            box-sizing: border-box;
        }

        .quiz-q-header-edit {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: bold;
            color: #475569;
            font-size: 16px;
        }

        .quiz-q-text-input {
            width: 100%;
            padding: 12px;
            font-size: 1.2em;
            border: 2px solid #E2E8F0;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            outline: none;
            box-sizing: border-box;
        }

        .quiz-q-text-input:focus {
            border-color: var(--primary);
        }

        .quiz-edit-option {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            background: #F8FAFC;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #E2E8F0;
            width: 100%;
            box-sizing: border-box;
        }

        .quiz-edit-option input[type="radio"] {
            transform: scale(1.5);
            cursor: pointer;
            margin: 0;
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            flex-shrink: 0;
        }

        .quiz-edit-option input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            min-width: 0;
            box-sizing: border-box;
        }

        .quiz-edit-option input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn-text {
            background: #F1F5F9;
            color: #334155;
            border: 1px solid #CBD5E1;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .btn-text:hover {
            background: #E2E8F0;
        }

        /* --- ESTILOS DE TAREAS / QUIZ (Vista Kahoot) --- */
        .quiz-app-container {
            background: linear-gradient(135deg, #F8FAFC 0%, #F1F5F9 100%);
            padding: 60px 40px;
            border-radius: 24px;
            border: 1px solid #E2E8F0;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            margin: 40px 0;
        }

        .quiz-name-input {
            width: 100%;
            max-width: 600px;
            padding: 25px;
            font-size: 28px;
            border: 3px solid #CBD5E1;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
            font-weight: bold;
            outline: none;
            transition: border-color 0.3s;
        }

        .quiz-name-input:focus {
            border-color: var(--primary);
        }

        .quiz-start,
        .quiz-results {
            text-align: center;
        }

        .quiz-q-header {
            font-size: 20px;
            color: #64748b;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .quiz-question {
            font-size: 3.5em;
            margin-bottom: 40px;
            font-weight: 900;
            color: #0f172a;
            overflow-wrap: break-word;
            word-break: break-word;
            line-height: 1.2;
        }

        .kahoot-grid {
            display: grid;
            gap: 24px;
        }

        .k-btn {
            padding: 40px 20px;
            font-size: 2.5em;
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.2);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-wrap: break-word;
            word-break: break-word;
            line-height: 1.3;
        }

        .k-btn:active:not(:disabled) {
            transform: translateY(8px);
            box-shadow: none;
        }

        .k-red {
            background-color: #E21B3C;
        }

        .k-blue {
            background-color: #1368CE;
        }

        .k-yellow {
            background-color: #D89E00;
        }

        .k-green {
            background-color: #26890C;
        }

        .quiz-feedback {
            text-align: center;
            font-size: 3em;
            font-weight: 900;
            margin-top: 30px;
            min-height: 1.5em;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .correct-feedback {
            color: #26890C;
        }

        .incorrect-feedback {
            color: #E21B3C;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* --- MENÚ LATERAL (ÍNDICE) --- */
        .toc-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            z-index: 10004;
            display: none;
            backdrop-filter: blur(4px);
        }

        .toc-overlay.open {
            display: block;
        }

        .toc-menu {
            position: fixed;
            top: 0;
            left: -100%;
            width: 350px;
            max-width: 85%;
            height: 100%;
            height: 100dvh;
            background: white;
            z-index: 10005;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            padding: 30px 30px 90px 30px;
            box-shadow: 10px 0 25px rgba(0, 0, 0, 0.15);
        }

        .toc-menu.open {
            left: 0;
        }

        .toc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .toc-header h3 {
            margin: 0;
            font-size: 24px;
            color: #0F172A;
            font-weight: 800;
        }

        .toc-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #64748B;
            padding: 0;
            transition: color 0.2s;
        }

        .toc-close:hover {
            color: #0F172A;
        }

        .toc-item {
            list-style: none;
            margin-bottom: 10px;
        }

        .toc-item a {
            text-decoration: none;
            color: #334155;
            display: block;
            padding: 10px 12px;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s;
            line-height: 1.4;
            white-space: normal;
            word-wrap: break-word;
            font-size: 16px;
        }

        .toc-item a:hover {
            background: #EEF2FF;
            color: var(--primary);
            font-weight: bold;
        }

        .toc-h1 {
            font-weight: 800;
            font-size: 18px;
            margin-top: 25px;
            border-bottom: 2px solid #E2E8F0;
            padding-bottom: 8px;
            color: #0F172A;
        }

        .toc-h1 a {
            font-size: 18px;
            color: #0F172A;
        }

        .toc-h2 {
            margin-left: 15px;
            font-weight: 700;
            color: #1E293B;
        }

        .toc-h3 {
            margin-left: 30px;
            color: #475569;
        }

        /* --- BARRA INFERIOR UNIFICADA (PC Y MÓVIL) --- */
        .mobile-bottom-bar {
            display: flex;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: rgba(255, 255, 255, 0.95);
            border-top: 1px solid #E2E8F0;
            justify-content: center;
            gap: 50px;
            align-items: center;
            z-index: 99999;
            padding-bottom: env(safe-area-inset-bottom);
            backdrop-filter: blur(10px);
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.05);
        }

        .bottom-bar-btn {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #64748B;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            width: 100px;
            gap: 8px;
            text-decoration: none;
            padding: 0;
            height: 100%;
            transition: all 0.2s;
        }

        .bottom-bar-btn svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            transition: transform 0.2s;
        }

        .bottom-bar-btn:hover {
            color: var(--primary);
            background-color: #F3F4F6;
            border-radius: 8px;
        }

        .bottom-bar-btn.active {
            color: var(--danger);
        }

        #save-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #10B981;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 100000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transform: translateY(-20px);
        }

        #save-indicator.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Modal Flotante de Contraseña */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            backdrop-filter: blur(6px);
        }

        .modal-content {
            background: white;
            padding: 35px;
            border-radius: 16px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal-content h3 {
            margin-top: 0;
            color: #0F172A;
            font-size: 1.8em;
            margin-bottom: 20px;
        }

        .modal-content input {
            width: 100%;
            padding: 15px;

        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // 🚨 IMPORTANTE PARA GITHUB: 🚨
        // GitHub es estático. Para que tus estudiantes vean tus cambios en tiempo real
        // sin que tengas que descargar y subir el archivo cada vez, debes colocar aquí
        // los datos de tu propia cuenta gratuita de Firebase (Google).
        // Si no cambias "AQUI_TU_API_KEY", la app intentará guardar solo en tu memoria local.
        // =========================================================================
        let firebaseConfig = {

            authDomain: "derecho-hidrocarburos-minero.firebaseapp.com",
            projectId: "derecho-hidrocarburos-minero",
            storageBucket: "derecho-hidrocarburos-minero.firebasestorage.app",
            messagingSenderId: "85123490263",
            appId: "1:85123490263:web:2ce3540675a3160f9feb92"
        };
        // =========================================================================

        let useFirebase = false;
        let isCanvasEnv = false;

        // Comprobar si estamos en el entorno de pruebas interno
        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                firebaseConfig = JSON.parse(__firebase_config);
                useFirebase = true;
                isCanvasEnv = true;
            } else if (firebaseConfig.apiKey !== "AQUI_TU_API_KEY") {
                useFirebase = true; // El profesor ha puesto sus credenciales
            }
        } catch (e) {
            console.warn("No se pudo cargar la configuración de Firebase");
        }

        let app, auth, db, docRef;
        const appIdStr = typeof __app_id !== 'undefined' ? __app_id : 'mi-presentacion-app';

        if (useFirebase) {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            // Ruta donde se guardará toda la presentación (Regla estricta)
            docRef = doc(db, 'artifacts', appIdStr, 'public', 'data', 'presentations', 'main_doc');

            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (e) { console.error("Error autenticando", e); }
            };
            initAuth();
        }

        // --- EXPORTAR FUNCIONES AL ÁMBITO GLOBAL PARA HTML ---
        window.toggleMenu = toggleMenu;
        window.downloadHTML = downloadHTML;
        window.toggleLaser = toggleLaser;
        window.toggleAppMode = toggleAppMode;
        window.closePasswordModal = closePasswordModal;
        window.checkPassword = checkPassword;
        window.addBlock = addBlock;
        window.deleteBlock = deleteBlock;
        window.moveBlock = moveBlock;
        window.setImageURL = setImageURL;
        window.copyCode = copyCode;

        const SVG = {
            edit: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>',
            view: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>',
            del: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>',
            up: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>',

            refresh: '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>',
            plus: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
            copy: '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>'
        };

        let blocks = [];
        let draggedBlockId = null;
        let activeBlockId = null;
        let isSyncing = false; // Bandera para evitar bucles de sincronización
        const editor = document.getElementById('editor');
        const saveIndicator = document.getElementById('save-indicator');
        let saveTimeout;

        window.onload = () => {
            // Cargar de Local Storage como respaldo inmediato
            const savedData = localStorage.getItem('presentacionFacil');
            if (savedData) {
                blocks = JSON.parse(savedData);
                renderEditor();
            } else if (!useFirebase) {
                blocks = [{ id: Date.now(), type: 'h1', content: '' }];
                renderEditor();
            }

            // Iniciar sincronización en vivo con la Nube (si está configurada)
            if (useFirebase) {
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        onSnapshot(docRef, (docSnap) => {
                            if (docSnap.exists() && !isSyncing) {
                                const cloudData = docSnap.data().blocksStr;
                                if (cloudData) {
                                    blocks = JSON.parse(cloudData);
                                    localStorage.setItem('presentacionFacil', cloudData); // Sincronizar copia local
                                    renderEditor();
                                }
                            } else if (!docSnap.exists() && blocks.length === 0) {
                                blocks = [{ id: Date.now(), type: 'h1', content: '' }];
                                renderEditor();
                            }
                        }, (error) => {
                            console.error("Error leyendo nube:", error);
                        });
                    }
                });
            } else if (!isCanvasEnv) {
                // Alerta para el usuario si no ha puesto las credenciales en GitHub
                console.warn("⚠️ MODO GITHUB: Para sincronizar en vivo, debes colocar tu configuración de Firebase en el código fuente.");
            }

            document.getElementById('prof-password').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') checkPassword();
            });
        };

        function showSaveIndicator(text = "Guardado") {
            saveIndicator.innerHTML = text;
            saveIndicator.classList.add('show');
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => { saveIndicator.classList.remove('show'); }, 2500);
        }

        async function autoSave() {
            const blocksStr = JSON.stringify(blocks);
            localStorage.setItem('presentacionFacil', blocksStr);
            generateMenu();

            if (useFirebase && auth.currentUser) {
                isSyncing = true;
                showSaveIndicator("Guardando en la Nube... ☁️");
                try {
                    await setDoc(docRef, { blocksStr: blocksStr }, { merge: true });
                    showSaveIndicator("Sincronizado 🌍");
                } catch (e) {
                    console.error("Error al sincronizar con Firebase:", e);
                    showSaveIndicator("Error al sincronizar ❌");
                } finally {
                    setTimeout(() => { isSyncing = false; }, 500);
                }
            } else {
                showSaveIndicator("Guardado Local 💾");
            }
        }

        function toggleMenu() {
            const menu = document.getElementById('toc-menu');
            const overlay = document.getElementById('toc-overlay');
            if (menu.classList.contains('open')) {
                menu.classList.remove('open');
                overlay.classList.remove('open');
            } else {
                menu.classList.add('open');
                overlay.classList.add('open');
            }
        }

        function generateMenu() {
            const tocList = document.getElementById('toc-list');
            if (!tocList) return;
            tocList.innerHTML = '';
            let hasItems = false;
            blocks.forEach(b => {
                if (['h1', 'h2', 'h3'].includes(b.type) && b.content.trim() !== '') {
                    hasItems = true;
                    const li = document.createElement('li');
                    li.className = 'toc-item toc-' + b.type;
                    const tempDiv = document.createElement('div'); tempDiv.innerHTML = b.content;
                    const text = tempDiv.textContent || tempDiv.innerText || 'Sin título';
                    li.innerHTML = `<a href="#block-${b.id}" onclick="toggleMenu()">${text}</a>`;
                    tocList.appendChild(li);
                }
            });
            if (!hasItems) tocList.innerHTML = '<p style="color:#94A3B8; text-align:center; margin-top:30px; font-size:16px;">No hay unidades registradas.</p>';

        let laserActive = false; let mouseX = -100, mouseY = -100;
        function toggleLaser() {
            laserActive = !laserActive;
            const canvas = document.getElementById('laser-canvas');
            const mobBtn = document.getElementById('btn-laser-mobile');
            if (laserActive) {
                canvas.classList.add('active');
                document.body.classList.add('laser-on');
                if (mobBtn) { mobBtn.classList.add('active'); document.getElementById('text-laser-mobile').innerText = 'Apagar'; }
            } else {
                canvas.classList.remove('active');
                document.body.classList.remove('laser-on');
                if (mobBtn) { mobBtn.classList.remove('active'); document.getElementById('text-laser-mobile').innerText = 'Láser'; }
                const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && laserActive) toggleLaser(); });
        const canvas = document.getElementById('laser-canvas'); const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        window.addEventListener('touchstart', (e) => { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; }, { passive: true });
        window.addEventListener('touchmove', (e) => { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; }, { passive: true });
        function drawLaser() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (laserActive) {
                ctx.beginPath(); ctx.arc(mouseX, mouseY, 8, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(239, 68, 68, 0.9)'; ctx.shadowColor = 'rgba(239, 68, 68, 1)';
                ctx.shadowBlur = 15; ctx.fill(); ctx.shadowBlur = 0;
            }
            requestAnimationFrame(drawLaser);
        }
        drawLaser();

        function addBlock(type) {
            if (type === 'h1' && blocks.some(b => b.type === 'h1')) return alert("Solo un H1 (Nombre de materia) por presentación.");
            const newBlock = { id: Date.now(), type: type, content: '', url: '' };
            if (type === 'p-img') newBlock.content = '';
            if (type === 'link') { newBlock.content = 'Enlace'; newBlock.url = 'https://'; }
            if (type === 'quiz') { newBlock.quizTitle = 'Título de la Tarea'; newBlock.questions = [{ q: '', options: ['', '', '', ''], correctIndex: 0 }]; }

            if (activeBlockId) {
                const index = blocks.findIndex(b => b.id === activeBlockId);
                if (index !== -1) blocks.splice(index + 1, 0, newBlock);
                else blocks.push(newBlock);

                blocks.push(newBlock);

            activeBlockId = newBlock.id;

            activeBlockId = id;

        }
        function updateText(id, newText) { const block = blocks.find(b => b.id === id); if (block) { block.content = newText; autoSave(); } }
        function setImageURL(id, urlInputId) { const url = document.getElementById(urlInputId).value; if (url.trim() !== '') { const block = blocks.find(b => b.id === id); if (block) { block.url = url; autoSave(); renderEditor(); } } }

        function getVideoEmbedHTML(url) {
            const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
            if (ytMatch && ytMatch[1]) return `<div class="video-wrapper yt-wrapper"><iframe src="https://www.youtube.com/embed/${ytMatch[1]}" allowfullscreen></iframe></div>`;
            const tkMatch = url.match(/tiktok\.com\/.*video\/(\d+)/);

        function createUrlBox(blockId, type) {

            return box;
        }

        function initQuizzes() {
            document.querySelectorAll('.quiz-app-container').forEach(container => {
                if (container.dataset.initialized) return;
                container.dataset.initialized = 'true';

                const root = container.querySelector('.quiz-ui-root');
                const block = JSON.parse(decodeURIComponent(container.dataset.quiz));

                let studentName = '', score = 0, currentQ = 0, shuffledQs = [];
                const colors = ['k-red', 'k-blue', 'k-yellow', 'k-green'];

                function renderStart() {
                    root.innerHTML = `<div class="quiz-start"><div style="font-size:70px; margin-bottom:20px;">🎓</div><h2 style="margin:0 0 20px; font-size:40px; color:#0f172a; overflow-wrap:break-word;">${block.quizTitle || 'Tarea'}</h2><p style="color:#64748b; margin-bottom:30px; font-size:22px;">Ingresa tu nombre para comenzar la evaluación.</p><input type="text" id="sn-${block.id}" placeholder="Tu nombre..." class="quiz-name-input"><br><button class="btn-text" style="width:100%; max-width:400px; padding:20px; background:var(--primary); color:white; font-size:24px; border:none; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1);" id="st-${block.id}">Comenzar Prueba</button></div>`;
                    document.getElementById(`st-${block.id}`).onclick = () => {
                        const nm = document.getElementById(`sn-${block.id}`).value.trim(); if (!nm) return alert('Por favor, ingresa tu nombre.'); studentName = nm;
                        let vQs = block.questions.filter(q => q.q.trim() !== ''); vQs.sort(() => Math.random() - 0.5); shuffledQs = vQs.slice(0, 10);
                        if (shuffledQs.length === 0) return root.innerHTML = `<p style="text-align:center; font-size:2em; color:#64748B;">Esta tarea aún no tiene preguntas configuradas.</p>`;
                        score = 0; currentQ = 0; renderQuestion();
                    };
                }

                function renderQuestion() {
                    const qD = shuffledQs[currentQ];
                    let opts = qD.options.map((text, i) => ({ text, isCorrect: i === qD.correctIndex })); opts.sort(() => Math.random() - 0.5);
                    let optsHtml = opts.map((opt, i) => `<button class="k-btn ${colors[i % 4]}" data-correct="${opt.isCorrect}">${opt.text}</button>`).join('');
                    root.innerHTML = `<div class="quiz-q-header">PREGUNTA ${currentQ + 1} DE ${shuffledQs.length}</div><h3 class="quiz-question">${qD.q}</h3><div class="kahoot-grid" style="grid-template-columns: ${opts.length === 2 ? '1fr' : '1fr 1fr'}">${optsHtml}</div><div class="quiz-feedback" style="display:none;"></div><button class="btn-text quiz-next-btn" style="display:none; margin: 40px auto 0; padding:15px 40px; background:#0F172A; color:white; border:none; font-size:24px;">Siguiente ➡️</button>`;

                    const btns = root.querySelectorAll('.k-btn'), fb = root.querySelector('.quiz-feedback'), nBtn = root.querySelector('.quiz-next-btn');
                    btns.forEach(btn => {
                        btn.onclick = () => {
                            btns.forEach(b => { b.disabled = true; b.style.opacity = '0.5'; }); btn.style.opacity = '1';
                            const isC = btn.dataset.correct === 'true'; fb.style.display = 'block';
                            if (isC) { score++; fb.innerHTML = "¡Correcto! ✅"; fb.className = 'quiz-feedback correct-feedback'; }
                            else {
                                fb.innerHTML = "Incorrecto ❌"; fb.className = 'quiz-feedback incorrect-feedback';
                                btns.forEach(b => { if (b.dataset.correct === 'true') { b.style.opacity = '1'; b.style.boxShadow = '0 0 0 6px #26890c'; } });
                            }
                            nBtn.style.display = 'flex';
                        };
                    });
                    nBtn.onclick = () => { currentQ++; if (currentQ < shuffledQs.length) renderQuestion(); else renderResults(); };
                }

                function renderResults() {
                    const fn = Math.round((score / shuffledQs.length) * 100), p = fn >= 51;
                    root.innerHTML = `<div class="quiz-results"><div style="font-size:100px; margin-bottom:20px;">${p ? '🏆' : '📚'}</div><h2 style="margin:0 0 15px; font-size:40px; color:#0f172a; overflow-wrap:break-word;">${block.quizTitle}</h2><p style="font-size:24px; color:#475569; margin-bottom: 30px;">Estudiante: <b>${studentName}</b></p><div style="background:white; padding:40px; border-radius:20px; border:4px solid ${p ? '#26890C' : '#E21B3C'}; max-width:450px; margin:0 auto 30px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);"><p style="margin:0 0 10px 0; font-size:18px; color:#64748B; font-weight:bold; letter-spacing:1px;">CALIFICACIÓN FINAL</p><h1 style="margin:0; font-size:100px; color:${p ? '#26890C' : '#E21B3C'}; line-height:1;">${fn}</h1><p style="margin:15px 0 0 0; font-size:22px; color:#334155;">${score} de ${shuffledQs.length} correctas</p></div><button class="btn-text" id="rt-${block.id}" style="margin: 0 auto; padding: 15px 30px; background:#0F172A; color:white; border:none; font-size:20px;">🔄 Volver a Intentar</button></div>`;
                    document.getElementById(`rt-${block.id}`).onclick = () => renderStart();
                }
                renderStart();
            });
        }

        // 8. DESCARGAR HTML SEGURO CON FIREBASE
        function downloadHTML() {
            const expD = document.implementation.createHTMLDocument("Mi Presentación");
            const ms = expD.createElement('meta'); ms.setAttribute('charset', 'UTF-8'); expD.head.appendChild(ms);
            const mv = expD.createElement('meta'); mv.setAttribute('name', 'viewport'); mv.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'); expD.head.appendChild(mv);

            const st = expD.createElement('style');
            st.textContent = document.querySelector('style').textContent; // Clonar estilos exactos
            expD.head.appendChild(st);

            // 1. Menú Lateral
            let menuHtml = ''; let hasItems = false;
            blocks.forEach(b => {
                if (['h1', 'h2', 'h3'].includes(b.type) && b.content.trim() !== '') {
                    hasItems = true; const tD = document.createElement('div'); tD.innerHTML = b.content;
                    menuHtml += `<li class="toc-item toc-${b.type}"><a href="#block-${b.id}" onclick="toggleMenu()">${tD.textContent || tD.innerText || 'Sin título'}</a></li>`;
                }
            });
            if (!hasItems) menuHtml = '<p style="color:#94A3B8; text-align:center; margin-top:30px; font-size:16px;">No hay unidades registradas.</p>';

            const tD = expD.createElement('div');
            tD.innerHTML = `<div id="toc-overlay" class="toc-overlay" onclick="toggleMenu()"></div><div id="toc-menu" class="toc-menu"><div class="toc-header"><h3>📑 Índice</h3><button class="toc-close" onclick="toggleMenu()"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div><ul id="toc-list" style="padding:0; margin:0;">${menuHtml}</ul></div>`;
            expD.body.appendChild(tD);

            // 2. Barra Inferior Mobile
            const mb = expD.createElement('div');
            mb.innerHTML = `<div id="mobile-bottom-bar" class="mobile-bottom-bar"><button class="bottom-bar-btn" onclick="toggleMenu()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></svg><span>Menú</span></button><a href="#" class="bottom-bar-btn" onclick="window.scrollTo(0,0); return false;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Inicio</span></a><button class="bottom-bar-btn" onclick="toggleLaser()" id="btn-laser-mobile"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg><span id="text-laser-mobile">Láser</span></button></div>`;
            expD.body.appendChild(mb);

            // 3. Contenedor de Editor
            const ed = expD.createElement('div');
            ed.id = 'editor';
            ed.innerHTML = '<p style="text-align:center; margin-top:50px; color:#94A3B8; font-size:20px;">Sincronizando con la nube... ☁️</p>';
            expD.body.appendChild(ed);

            const cv = expD.createElement('canvas'); cv.id = 'laser-canvas'; expD.body.appendChild(cv);

            // 4. Copiar exactamente el mismo script (magia pura para clonar lógica y sincronización)
            const sc = expD.createElement('script');
            sc.setAttribute('type', 'module');
            sc.textContent = document.getElementById('main-script').innerText;
            expD.body.appendChild(sc);

            const fnCode = "<!DOCTYPE html>\n" + expD.documentElement.outerHTML;
            const blob = new Blob([fnCode], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'index.html';
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            showSaveIndicator("¡Descargado para GitHub!");
        }
    </script>
